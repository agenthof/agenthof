title = "agenthof gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "documented demo credentials and offline test fixtures"
paths = [
  '''deploy/dex-config\.yaml''',                # bcrypt of the documented demo password
  '''cmd/agenthof/main_test\.go''',             # hand-minted offline test JWTs
  '''internal/identity/oidc_test\.go''',        # offline test JWTs minted with throwaway keys
  '''internal/gateway/provision_test\.go''',    # fake "sk-..." strings returned by an in-test mock LiteLLM admin server; never real credentials
  '''internal/config/signingkey_test\.go''',    # the Ed25519 golden seed 00..1f as PKCS#8 PEM — a published test vector pinning the key-file format, never a credential
  '''internal/sink/testdata/sigv4/.*''',         # AWS's published SigV4 test-suite vectors (AKIDEXAMPLE + the documented example STS token); offline signing fixtures, never credentials
]
regexes = [
  # An Ed25519 PUBLIC key that briefly appeared as the `trusted_signers` example
  # in docs/reference/config.md (history only — the current doc uses a
  # <placeholder>). A public key, never a secret; kept here because gitleaks
  # scans full history.
  '''11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=''',
  # A fake secret-shaped literal in the tool-resource validation test
  # (internal/registry/validate_test.go): the case proving that a VALUE typed
  # into `token_env` — which must be an env-var NAME — is rejected. Never a
  # credential; kept here because gitleaks scans full history.
  '''sk-live-abc123''',
  # The hub curator's Ed25519 PUBLIC key, echoed in scripts/e2e-hub-seatbelt.sh
  # as the trusted signer for the published hub cards. A public key, never a
  # secret; kept here because gitleaks scans full history.
  '''k2troapQ5SHzGpMeckKzHBUNcI517qZmiX/bw9Bl05o=''',
]

# Default: route through a local LiteLLM gateway (deploy/docker-compose.yml).
# Direct-to-provider alternative: swap endpoint to https://api.anthropic.com/v1
# and api_key_env to ANTHROPIC_API_KEY.
models:
  fast:
    endpoint: http://localhost:4000
    model: fast
    api_key_env: AGENTHOF_GATEWAY_KEY
defaults:
  model: fast

name: coder
description: Implements the plan with the smallest change
model: fast
instruction: |
  You are a coding agent. Implement the plan with the smallest change.
output: patch
execution: fronted
endpoint: http://127.0.0.1:8080/
# First-hand exec door: the agent asks Agenthof to run an allowlisted command,
# refexec (deploy/refexec) runs it in a no-network compartment and attests
# what ran, and Agenthof records that account. Agenthof never runs the
# command itself. The socket is dialed only when a step calls /exec/run.
exec:
  runtime: refexec
  url: unix:///run/agenthof-exec/refexec.sock
  timeout: 2m
  allow:
    - exe: "go"
      args_prefix: ["test"]

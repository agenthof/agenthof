name: e2e
on:
  schedule:
    - cron: "0 18 * * *"   # nightly, 18:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/e2e-dex.sh'
      - 'scripts/e2e-worm-minio.sh'
      - '.github/workflows/e2e.yml'
      - 'deploy/**'
      - 'cmd/agenthof/**'      # a CLI change (e.g. a removed flag) can break the e2e
      - 'examples/**'          # the e2e runs the example config + fronted agent
      - 'internal/**'          # the gateway/adapter/engine the e2e drives

permissions:
  contents: read

jobs:
  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./scripts/e2e-dex.sh
  worm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The script builds MinIO and mc from source at pinned releases;
          # keying the cache on the script too keeps that build warm across
          # runs instead of sharing (and never saving into) ci's go.sum key.
          cache-dependency-path: |
            go.sum
            scripts/e2e-worm-minio.sh
      - run: ./scripts/e2e-worm-minio.sh

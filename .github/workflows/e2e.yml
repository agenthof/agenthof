name: e2e
on:
  schedule:
    - cron: "0 18 * * *"   # nightly, 18:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/e2e-dex.sh'
      - '.github/workflows/e2e.yml'
      - 'deploy/**'

permissions:
  contents: read

jobs:
  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/e2e-dex.sh

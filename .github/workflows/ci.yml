name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -count=1 ./...

  langchain-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r examples/langchain-agent/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python -m unittest discover -s examples/langchain-agent -p 'test_*.py' -v
      - run: ./scripts/e2e-langchain-local.sh
        env:
          PYTHON: python

  refbridge-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts -p 'test_fake_token*' -v
      - run: ./scripts/e2e-refbridge-local.sh

  refexec-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./scripts/e2e-refexec-local.sh

  obo-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./scripts/e2e-obo-local.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans full history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...  # latest is deliberate: vuln DB fetched at runtime
      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE
      # secret for org repos; we don't have one, so run the (free, OSS)
      # gitleaks CLI directly instead of the action.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --config .gitleaks.toml --redact --no-banner

  fips:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: FIPS build gate (constitution Art. IV)
        run: GOFIPS140=latest go build ./...

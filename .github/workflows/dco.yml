name: dco
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Developer Certificate of Origin sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            # Skip merge commits (more than one parent): rev-list --parents
            # prints "<sha> <parent>..."; a normal commit has exactly two words.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip $sha (merge commit)"
              continue
            fi
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            # Skip bot commits (e.g. dependabot): they carry no sign-off.
            case "$author_email" in
              *"[bot]"*) echo "skip $sha (bot: $author_email)"; continue ;;
            esac
            case "$author_name" in
              *"[bot]") echo "skip $sha (bot: $author_name)"; continue ;;
            esac
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if git show -s --format='%B' "$sha" | grep -qF "$expected"; then
              echo "ok   $sha"
            else
              echo "FAIL $sha: missing '$expected'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more commits lack a Developer Certificate of Origin sign-off."
            echo "See CONTRIBUTING.md. Add it with 'git commit --amend -s' (single"
            echo "commit) or 'git rebase --signoff <base>' (multiple), then force-push"
            echo "your branch."
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."

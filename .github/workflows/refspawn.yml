name: refspawn
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/refspawn/**'
      - 'deploy/refexec/**'
      - 'deploy/refbox/**'
      - 'deploy/internal/refrunner/**'
      - 'examples/echo-agent/**'
      - 'scripts/e2e-refspawn.sh'
      - '.github/workflows/refspawn.yml'
      - 'internal/**'
      - 'cmd/agenthof/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  refspawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - run: ./scripts/e2e-refspawn.sh
